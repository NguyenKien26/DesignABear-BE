version: "3.9"

services:
  toys-ecommerce-api:
    image: minhtri10504/toys-ecommerce-api:1.2.0
    build:
      context: .
      dockerfile: DesignABear.WebAPI/Dockerfile
    container_name: toys_ecommerce_api
    ports:
      - "7002:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - Redis__Configuration=redis:6379,abortConnect=false
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: toys_ecommerce_redis
    ports:
      - "6379:6379"
    restart: always
